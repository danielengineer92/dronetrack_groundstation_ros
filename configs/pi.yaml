# =============================================================================
# Pi-side parameters (split DroneTrack architecture)
#
# This is the single authoritative config for everything that runs ON THE DRONE.
# The reused sections (camera/tracker/telemetry/autonomy/mission/control/health)
# are carried over verbatim from dronetrack_pi_ros full_system_params.yaml so the
# Pi behaves identically. YOLO, visualizer, and dashboard sections were removed
# because those now run on the laptop (see configs/groundstation.yaml).
#
# Topic names are kept compatible with dronetrack_pi_ros. See configs/topics.yaml
# for the boundary topic map and configs/network.example.yaml for IP/DDS setup.
# =============================================================================

# ---- NEW: laptop perception trust boundary ----------------------------------
detection_gate_node:
  ros__parameters:
    inbound_detections_topic: "/groundstation/vision/detections"   # untrusted, from laptop
    outbound_detections_topic: "/drone/vision/detections"          # trusted, to Pi tracker
    heartbeat_topic: "/groundstation/heartbeat"
    max_detection_age_s: 1.5        # drop frames older than this (Pi->laptop->Pi round-trip;
                                    # raised from 0.5 to tolerate weak-Wi-Fi latency + inference)
    max_heartbeat_age_s: 1.0        # link considered down past this
    require_heartbeat: true         # no heartbeat yet => drop all detections
    max_message_rate_hz: 60.0       # inbound flood / DoS cap
    max_detections: 20              # absurd-payload cap
    min_confidence: 0.05            # noise floor (tracker still has its own min_confidence)
    clock_skew_tolerance_s: 0.25    # tolerate small future stamps from clock jitter
    report_period_s: 5.0

# ---- NEW: ground-station watchdog -------------------------------------------
ground_station_watchdog_node:
  ros__parameters:
    heartbeat_topic: "/groundstation/heartbeat"
    inbound_detections_topic: "/groundstation/vision/detections"
    link_status_topic: "/drone/groundstation/link_status"
    link_ok_topic: "/drone/groundstation/ok"
    autonomy_request_topic: "/drone/autonomy/request"
    offboard_request_topic: "/drone/mavsdk/offboard_request"
    mavsdk_action_topic: "/drone/mavsdk/action_command"
    max_heartbeat_age_s: 1.0
    max_detection_age_s: 1.0
    check_rate_hz: 10.0
    deassert_on_link_loss: true     # publish autonomy/offboard request=false on link loss
    request_hold_on_link_loss: false  # also request MAVSDK HOLD (needs allow_mavsdk_actions on Pi)

native_mjpeg_camera_node:
  ros__parameters:
    compressed_image_topic: "/drone/camera/image_raw/compressed"
    frame_id: "camera_optical_frame"
    camera_device: "/dev/video0"
    camera_index: 0
    frame_width: 640
    frame_height: 480
    fps: 60.0
    fourcc: "MJPG"
    buffer_count: 4
    report_period_s: 5.0

camera_compressor_node:
  ros__parameters:
    image_topic: "/drone/camera/image_raw"
    compressed_image_topic: "/drone/camera/image_raw/compressed"
    jpeg_quality: 80
    report_period_s: 5.0

# ---- REUSED from dronetrack_pi_ros (must stay on the Pi) ---------------------
camera_node:
  ros__parameters:
    image_topic: "/drone/camera/image_raw"
    frame_id: "camera_optical_frame"
    buffer_size: 1
    camera_index: 0
    frame_width: 640
    frame_height: 480
    fps: 60.0
    camera_backend: "v4l2"
    fourcc: "MJPG"

tracker_node:
  ros__parameters:
    detections_topic: "/drone/vision/detections"   # gate republishes here
    target_error_topic: "/drone/tracking/target_error"
    target_class: "red_ball"
    min_confidence: 0.08
    detection_timeout: 2.5
    reacquisition_timeout: 6.0
    smoothing_alpha: 0.35
    target_area_min: 0.0001   # 0.2m ball stays trackable to ~16m (was 0.0004 = ~8m cutoff; far orbit hit 9m)
    target_area_max: 0.7
    publish_rate: 30.0
    proximity_threshold: 0.12
    stale_detection_timeout: 3.5
    missed_detection_threshold: 10
    coast_timeout: 3.5
    lock_confirm_frames: 1
    estimate_distance: true
    # Empirical: distance_m = k / diameter_px. Calibrated against gz truth in
    # SITL (k = true_dist * bbox_diam_px: 3.2m*30.5px=98, 6.3m*16.6px=105).
    # Empirically fit to 19 SITL ground-truth samples (drone-vs-ball gz pose)
    # spanning 3.3-9m: k = diam_px * true_slant = 147 (mean). Pinhole predicts
    # fx*D=539*0.2=108; YOLO boxes run ~1.36x fat, hence 147. (was 100, tuned
    # for the old 960-wide fx=405 assumption -> read 32% low on the 1280 cam.)
    # RE-CALIBRATE FOR REAL HARDWARE: put the ball at a tape-measured distance
    # and run  scripts/ros_wsl.sh env python3 scripts/calibrate_distance.py \
    #   --true-distance-m <m>   — it prints the k (and fat-factor) to set here.
    # k is camera+model specific; re-run after retraining or swapping YOLO.
    distance_calibration_k: 147.0
    # Sim ball is 0.20 m; the REAL DroneTrack ball is 8.5 in = 0.2159 m — set
    # that on hardware (used by the pinhole fallback when k <= 0, and by the
    # calibration tool's fat-factor report).
    ball_diameter_m: 0.20
    focal_length_px: 0.0
    # Must match the gz mono_cam sensor (horizontal_fov 1.74 rad) at 1280x960,
    # fx=fy=539 px. MUST equal the resolution YOLO runs on: Wrong FOV skews bearing_x/bearing_y
    # (and the pinhole distance fallback) by fx_err.
    horizontal_fov_deg: 99.7
    vertical_fov_deg: 83.3
    image_width_px: 1280
    image_height_px: 960
    min_distance_m: 0.25
    max_distance_m: 12.0
    distance_filter_alpha: 0.25

telemetry_node:
  ros__parameters:
    telemetry_topic: "/drone/telemetry"
    connection_url: "serial:///dev/ttyACM0:57600"
    publish_rate: 10.0
    reconnect_interval: 5.0
    connection_timeout: 10.0
    control_command_topic: "/drone/control/command"
    offboard_enable_topic: "/drone/mavsdk/offboard_enable"
    command_status_topic: "/drone/mavsdk/command_status"
    action_command_topic: "/drone/mavsdk/action_command"
    mavsdk_offboard_enabled: false
    command_rate: 20.0
    command_timeout: 0.5
    require_armed_for_offboard: true
    min_battery_percent: 20.0
    max_yaw_rate_rad_s: 1.0
    allow_translation_commands: false
    stop_offboard_on_disable: true
    allow_mavsdk_actions: false      # keep false for normal hardware bench work
    allow_arm_via_mavsdk: false      # extra opt-in for the dashboard Arm button; hardware stays false
    action_command_timeout: 3.0
    action_telemetry_timeout: 2.0
    action_airborne_altitude_m: 0.5

autonomy_manager_node:
  ros__parameters:
    autonomy_request_topic: "/drone/autonomy/request"
    offboard_request_topic: "/drone/mavsdk/offboard_request"
    target_error_topic: "/drone/tracking/target_error"
    telemetry_topic: "/drone/telemetry"
    autonomy_enable_topic: "/drone/autonomy/enabled"
    offboard_enable_topic: "/drone/mavsdk/offboard_enable"
    autonomy_state_topic: "/drone/autonomy/state"
    manager_enabled: true
    initial_autonomy_request: false
    initial_offboard_request: false
    publish_rate: 10.0
    target_timeout: 3.0
    telemetry_timeout: 2.0
    request_timeout: 0.0
    enable_offboard_when_ready: true
    # Opt-in (default OFF): allow pre-lock, yaw-only autonomy during a SCAN step so
    # the drone can yaw-sweep to search. Movement stays yaw-only (control_node holds
    # position in SCAN mode). Leave false on hardware unless you want search sweeps.
    allow_scan_without_lock: false
    mission_command_topic: "/drone/mission/command"
    mission_command_timeout: 1.0
    require_connected: true
    require_armed: true
    require_health_all_ok: false
    require_gps: false
    required_flight_mode: ""
    min_battery_percent: 20.0

mission_executor_node:
  ros__parameters:
    mission_enabled: true
    auto_start: false
    mission_request_topic: "/drone/mission/request"
    mission_command_topic: "/drone/mission/command"
    mission_state_topic: "/drone/mission/state"
    mavsdk_action_topic: "/drone/mavsdk/action_command"
    autonomy_request_topic: "/drone/autonomy/request"
    offboard_request_topic: "/drone/mavsdk/offboard_request"
    target_error_topic: "/drone/tracking/target_error"
    telemetry_topic: "/drone/telemetry"
    publish_rate: 10.0
    require_connected_for_mission: true
    require_armed_for_mission: true
    telemetry_timeout_s: 2.0
    takeoff_altitude_m: 3.0
    # A commanded 3.0 m takeoff settles at ~2.75 m measured; 2.7 left 5 cm of
    # margin and flapped NOT_AIRBORNE mid-orbit. Keep this well under hover.
    airborne_altitude_m: 2.3
    takeoff_timeout_s: 20.0
    offboard_prime_time_s: 1.5
    track_center_timeout_s: 0.0
    run_full_orbit_after_track_center: false
    # Scan-for-target defaults (overridable per scan step in the mission YAML).
    scan_yaw_deg: 180.0
    scan_yaw_rate_deg_s: 20.0
    scan_timeout_s: 12.0
    # goto step defaults (world-frame offset reposition via MAVSDK goto_location;
    # gated by telemetry_node.allow_mavsdk_actions like TAKEOFF/DO_ORBIT).
    goto_timeout_s: 30.0
    goto_tolerance_m: 1.0
    mission_plan_file: ""
    # Runtime plan upload (dashboard mission builder). Plans arriving here are
    # fully re-validated and refused while a mission is active. Set the request
    # topic to "" to disable uploads entirely (e.g. locked-down hardware).
    mission_plan_topic: "/drone/mission/plan_request"
    mission_plan_ack_topic: "/drone/mission/plan_ack"
    event_log_enabled: true
    event_log_directory: "~/drone_mission_logs"

target_state_estimator_node:
  ros__parameters:
    target_error_topic: "/drone/tracking/target_error"
    telemetry_topic: "/drone/telemetry"
    target_state_topic: "/drone/tracking/target_state"
    publish_rate_hz: 10.0
    # CV-Kalman process noise: how hard the target may maneuver (m^2/s^3).
    # 0.3 tracks the sim ball's orbit accel (~0.3 m/s^2); raise for agile
    # targets (faster response, noisier velocity).
    accel_noise_density: 0.3
    # Measurement noise model: cross-range from bearing (~0.23 deg), radial
    # from monocular k/diam (a fixed pixel jitter is a fixed FRACTION of
    # range -> sigma_r = fraction * range, floored).
    sigma_bearing_rad: 0.004
    sigma_range_fraction: 0.08
    sigma_range_floor_m: 0.15
    prediction_horizon_s: 0.5
    coast_timeout_s: 2.0
    reset_timeout_s: 4.0
    min_updates_for_valid: 8
    max_telemetry_age_s: 0.5

control_node:
  ros__parameters:
    target_error_topic: "/drone/tracking/target_error"
    telemetry_topic: "/drone/telemetry"
    control_command_topic: "/drone/control/command"
    mission_command_topic: "/drone/mission/command"
    autonomy_enabled: false
    # Yaw tracking PID. gain_yaw is the P term (tuned 2026-07-03, see
    # docs/pid_tuning_report.md). ki/kd default 0 = the flight-proven pure-P
    # law; both are runtime-tunable (ros2 param set /control_node yaw_ki 0.1).
    # ki trims the standing lag on a continuously moving target (start ~0.1,
    # anti-windup + yaw_i_limit cap its authority); kd damps overshoot at
    # high gain (start ~0.05 — D is low-pass filtered, yaw_d_lpf_alpha).
    gain_yaw: 1.5
    yaw_ki: 0.0
    yaw_kd: 0.0
    yaw_i_limit: 0.3       # max integral contribution, rad/s
    yaw_d_lpf_alpha: 0.35  # D low-pass blend (0,1]; 1 = raw derivative
    # LOS-rate feed-forward: commands the rate the ball is moving at (from
    # MEASURED telemetry yaw + camera bearing — never the command itself), so
    # the drone aims at the ball's motion instead of trailing it. SITL A/B on
    # the orbiting ball: mean|error_x| 0.105 -> 0.054 (-49%), peak 0.30 ->
    # 0.15, zero added sign-flips. Structurally zero for a still target.
    yaw_ff_gain: 1.0
    yaw_ff_lpf_alpha: 0.25  # LOS-rate low-pass (vision + 10 Hz yaw jitter)
    yaw_ff_limit: 1.5       # rad/s cap on the feed-forward term
    gain_down: 0.3
    gain_forward: 1.0
    gain_right: 1.0
    deadband_x: 0.05
    deadband_y: 0.05
    max_velocity_forward: 2.0
    max_velocity_right: 2.0
    max_velocity_down: 0.5
    max_yaw_rate: 1.0
    max_accel_forward: 1.5
    max_accel_right: 1.5
    max_accel_down: 0.5
    max_yaw_accel: 1.2
    min_battery_percent: 25.0
    require_gps: false
    require_armed: true
    min_altitude_m: 2.0
    control_rate: 20.0
    target_timeout: 3.0
    mission_command_timeout: 1.0
    telemetry_timeout: 2.0
    # APPROACH translation stays OFF by default. Even if set true, the resulting
    # VELOCITY command is still gated by telemetry_node.allow_translation_commands.
    enable_approach_translation: false
    approach_distance_deadband_m: 0.15

health_monitor_node:
  ros__parameters:
    image_topic: "/drone/camera/image_raw/compressed"
    image_is_compressed: true
    detections_topic: "/drone/vision/detections"
    target_error_topic: "/drone/tracking/target_error"
    telemetry_topic: "/drone/telemetry"
    control_command_topic: "/drone/control/command"
    mavsdk_command_status_topic: "/drone/mavsdk/command_status"
    mavsdk_action_topic: "/drone/mavsdk/action_command"
    monitor_mavsdk_command_status: true
    heartbeat_period: 2.0
    stale_seconds: 2.0
